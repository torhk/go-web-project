{{define "login.html"}}
{{template "header" .}}
<h1>Login</h1>
<form action="/login" method="POST">
    <fieldset role="group">
        <input name="uname" type="text" placeholder="Username" autocomplete="username" />
        <input name="psw" type="password" placeholder="Password" />
        <input type="submit" value="Log in" />
    </fieldset>
</form>
{{template "footer" .}}
{{end}}
